<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Gestion de servicios</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- ICONOS -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- JSPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- AUTOTABLE -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <div class="logo">

      <i class="fa-solid fa-tower-cell"></i>

      <span>
        Gestión de Servicios
      </span>

    </div>

    <div class="header-info">

      Sistema de Gestión de Servicios

    </div>

  </header>

  <!-- CONTENIDO -->
  <main class="container">

    <!-- TITULO -->
    <section class="title-section">

      <h1>
        Registro de Servicio Técnico
      </h1>

      <p>
        Completa el formulario para registrar
        instalaciones y mantenimientos.
      </p>

    </section>

    <!-- FORMULARIO -->
    <section class="form-section">

      <form id="serviceForm">

        <div class="grid">

          <!-- CLIENTE -->
          <div class="input-group">

            <label>
              Nombre del Cliente
            </label>

            <input
            type="text"
            id="clientName"
            required>

          </div>

          <!-- DIRECCION -->
          <div class="input-group">

            <label>
              Dirección
            </label>

            <input
            type="text"
            id="address"
            required>

          </div>

          <!-- FECHA -->
          <div class="input-group">

            <label>
              Fecha
            </label>

            <input
            type="date"
            id="date"
            required>

          </div>

          <!-- TICKET -->
          <div class="input-group">

            <label>
              Número / Ticket
            </label>

            <input
            type="text"
            id="ticket"
            required>

          </div>

          <!-- HORA ENTRADA -->
          <div class="input-group">

            <label>
              Hora Entrada
            </label>

            <input
            type="time"
            id="entryTime"
            required>

          </div>

          <!-- HORA SALIDA -->
          <div class="input-group">

            <label>
              Hora Salida
            </label>

            <input
            type="time"
            id="exitTime"
            required>

          </div>

          <!-- TIPO -->
          <div class="input-group full-width">

            <label>
              Tipo de Servicio
            </label>

            <select
            id="serviceType"
            required>

              <option value="">
                Selecciona
              </option>

              <option value="Instalación">
                Instalación
              </option>

              <option value="Mantenimiento">
                Mantenimiento
              </option>

            </select>

          </div>

          <!-- DESCRIPCION -->
          <div class="input-group full-width">

            <label>
              Descripción
            </label>

            <textarea
            id="description"
            rows="6"
            required></textarea>

          </div>

        </div>

        <!-- FIRMAS -->
        <section class="signature-section">

          <!-- CLIENTE -->
          <div class="signature-box">

            <label>
              Firma Cliente
            </label>

            <canvas
            id="clientSignature"
            width="400"
            height="200"></canvas>

            <button
            type="button"
            class="clear-btn"
            onclick="clearCanvas('clientSignature')">

              Limpiar Firma

            </button>

          </div>

          <!-- TECNICO -->
          <div class="signature-box">

            <label>
              Firma Prestador
            </label>

            <canvas
            id="providerSignature"
            width="400"
            height="200"></canvas>

            <button
            type="button"
            class="clear-btn"
            onclick="clearCanvas('providerSignature')">

              Limpiar Firma

            </button>

          </div>

        </section>

        <!-- BOTONES -->
        <div class="buttons">

          <button
          type="submit"
          class="save-btn">

            Guardar Servicio

          </button>

          <button
          type="button"
          class="pdf-btn"
          onclick="generatePDF()">

            Generar PDF

          </button>

        </div>

      </form>

    </section>

    <!-- TABLA -->
    <section class="table-section">

      <h2>
        Servicios Registrados
      </h2>

      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>Cliente</th>
              <th>Dirección</th>
              <th>Fecha</th>
              <th>Tipo</th>
              <th>Ticket</th>
              <th>Entrada</th>
              <th>Salida</th>
              <th>Acciones</th>

            </tr>

          </thead>

          <tbody id="tableBody">

          </tbody>

        </table>

      </div>

    </section>

  </main>

  <!-- JS -->
  <script src="app.js"></script>

</body>
</html>
