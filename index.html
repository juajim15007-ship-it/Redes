<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>
    Gestión de Servicios
  </title>

  <!-- CSS -->
  <link
  rel="stylesheet"
  href="style.css">

  <!-- ICONOS -->
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- JSPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- AUTOTABLE -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

</head>

<body>

  <!-- =======================================
       HEADER
  ======================================== -->

  <header class="header">

    <div class="logo">

      <i class="fa-solid fa-tower-cell"></i>

      <span>
        Gestión de Servicios Redes
      </span>

    </div>

    <div class="header-info">

      Sistema de Gestión Técnica

    </div>

  </header>

  <!-- =======================================
       CONTENIDO PRINCIPAL
  ======================================== -->

  <main class="container">

    <!-- TITULO -->

    <section class="title-section">

      <h1>
        Registro de Servicio Técnico
      </h1>

      <p>
        Completa el formulario para registrar
        instalaciones y mantenimientos.
      </p>

    </section>

    <!-- =======================================
         FORMULARIO
    ======================================== -->

    <section class="form-section">

      <form
      id="serviceForm"
      autocomplete="off">

        <div class="grid">

          <!-- CLIENTE -->

          <div class="input-group">

            <label for="clientName">
              Nombre del Cliente
            </label>

            <input
            type="text"
            id="clientName"
            placeholder="Ej: Juan Pérez"
            required>

          </div>

          <!-- DIRECCION -->

          <div class="input-group">

            <label for="address">
              Dirección
            </label>

            <input
            type="text"
            id="address"
            placeholder="Ej: Calle 10 #25-40"
            required>

          </div>

          <!-- FECHA -->

          <div class="input-group">

            <label for="date">
              Fecha
            </label>

            <input
            type="date"
            id="date"
            required>

          </div>

          <!-- TICKET -->

          <div class="input-group">

            <label for="ticket">
              Número / Ticket
            </label>

            <input
            type="number"
            id="ticket"
            placeholder="Ej: 1001"
            min="1"
            required>

          </div>

          <!-- HORA ENTRADA -->

          <div class="input-group">

            <label for="entryTime">
              Hora Entrada
            </label>

            <input
            type="time"
            id="entryTime"
            required>

          </div>

          <!-- HORA SALIDA -->

          <div class="input-group">

            <label for="exitTime">
              Hora Salida
            </label>

            <input
            type="time"
            id="exitTime"
            required>

          </div>

          <!-- TIPO SERVICIO -->

          <div class="input-group full-width">

            <label for="serviceType">
              Tipo de Servicio
            </label>

            <select
            id="serviceType"
            required>

              <option value="">
                Selecciona una opción
              </option>

              <option value="Instalación">
                Instalación
              </option>

              <option value="Mantenimiento">
                Mantenimiento
              </option>

            </select>

          </div>

          <!-- DESCRIPCION -->

          <div class="input-group full-width">

            <label for="description">
              Descripción del Trabajo Realizado
            </label>

            <textarea
            id="description"
            rows="6"
            placeholder="Describe el trabajo realizado..."
            required></textarea>

          </div>

        </div>

        <!-- =======================================
             FIRMAS
        ======================================== -->

        <section class="signature-section">

          <!-- FIRMA CLIENTE -->

          <div class="signature-box">

            <label>
              Firma Cliente
            </label>

            <canvas
            id="clientSignature"
            class="signature-preview"
            onclick="openSignatureModal('clientSignature')">
            </canvas>

          </div>

          <!-- FIRMA TECNICO -->

          <div class="signature-box">

            <label>
              Firma Prestador
            </label>

            <canvas
            id="providerSignature"
            class="signature-preview"
            onclick="openSignatureModal('providerSignature')">
            </canvas>

          </div>

        </section>

        <!-- =======================================
             BOTONES
        ======================================== -->

        <div class="buttons">

          <button
          type="submit"
          class="save-btn">

            <i class="fa-solid fa-floppy-disk"></i>

            Guardar Servicio

          </button>

          <button
          type="button"
          class="pdf-btn"
          onclick="generatePDF()">

            <i class="fa-solid fa-file-pdf"></i>

            Generar PDF

          </button>

        </div>

      </form>

    </section>

    <!-- =======================================
         TABLA
    ======================================== -->

    <section class="table-section">

      <h2>
        Servicios Registrados
      </h2>

      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>Cliente</th>

              <th>Dirección</th>

              <th>Fecha</th>

              <th>Tipo</th>

              <th>Ticket</th>

              <th>Entrada</th>

              <th>Salida</th>

              <th>Acciones</th>

            </tr>

          </thead>

          <tbody id="tableBody">

          </tbody>

        </table>

      </div>

    </section>

  </main>

  <!-- =======================================
       MODAL FIRMA DIGITAL
  ======================================== -->

  <div
  id="signatureModal"
  class="signature-modal">

    <div class="signature-modal-content">

      <h2>
        Firma Digital
      </h2>

      <p>
        Firma con tu dedo, mouse o lápiz táctil
      </p>

      <!-- CANVAS -->

      <canvas
      id="modalCanvas">
      </canvas>

      <!-- BOTONES MODAL -->

      <div class="modal-buttons">

        <button
        type="button"
        class="clear-signature-btn"
        onclick="clearModalSignature()">

          <i class="fa-solid fa-eraser"></i>

          Limpiar

        </button>

        <button
        type="button"
        class="save-signature-btn"
        onclick="saveSignature()">

          <i class="fa-solid fa-check"></i>

          Guardar Firma

        </button>

        <button
        type="button"
        class="close-signature-btn"
        onclick="closeSignatureModal()">

          <i class="fa-solid fa-xmark"></i>

          Cancelar

        </button>

      </div>

    </div>

  </div>
  <!-- SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <!-- JAVASCRIPT -->

  <script src="app.js"></script>

</body>

</html>
