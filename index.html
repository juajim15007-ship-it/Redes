<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Telecom Manager</title>

  <!-- ICONOS -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#111;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }

    .phone{
      width:380px;
      height:780px;
      background:#f4f4f7;
      border-radius:40px;
      overflow:hidden;
      position:relative;
      box-shadow:0 10px 30px rgba(0,0,0,.5);
      border:8px solid #222;
    }

    /* HEADER */
    .header{
      padding:25px 20px 10px;
      text-align:center;
      position:relative;
    }

    .header h1{
      font-size:32px;
      color:#222;
      font-weight:700;
    }

    .bell{
      position:absolute;
      right:20px;
      top:30px;
      font-size:22px;
      color:#555;
      cursor:pointer;
    }

    /* DASHBOARD */
    .dashboard{
      padding:15px;
    }

    .cards{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .card{
      background:#fff;
      padding:20px;
      border-radius:20px;
      box-shadow:0 3px 10px rgba(0,0,0,.08);
      transition:.3s;
    }

    .card:hover{
      transform:translateY(-3px);
    }

    .card i{
      font-size:30px;
      margin-bottom:15px;
    }

    .blue{ color:#2196f3; }
    .green{ color:#4caf50; }
    .orange{ color:#ff9800; }
    .purple{ color:#9c27b0; }

    .card h2{
      font-size:34px;
      color:#222;
    }

    .card p{
      color:#777;
      margin-top:5px;
    }

    /* INGRESOS */
    .income{
      margin-top:20px;
      background:#dff0ff;
      border-radius:20px;
      padding:25px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 3px 10px rgba(0,0,0,.08);
    }

    .income h3{
      color:#3f7dc7;
      margin-bottom:10px;
      font-size:20px;
    }

    .income h1{
      color:#1f4fa8;
      font-size:42px;
    }

    .income i{
      font-size:60px;
      color:#66aaf2;
    }

    /* SERVICIOS */
    .services{
      margin-top:30px;
    }

    .services-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    .services-header h2{
      color:#222;
    }

    .services-header span{
      color:#5a8ecb;
      cursor:pointer;
      font-weight:600;
    }

    .empty{
      text-align:center;
      margin-top:40px;
      color:#aaa;
    }

    .empty i{
      font-size:90px;
      margin-bottom:20px;
      color:#d2d2d2;
    }

    .empty p{
      margin-top:10px;
      font-size:18px;
    }

    /* BOTON */
    .add-btn{
      position:absolute;
      bottom:90px;
      right:20px;
      background:#cfe3ff;
      color:#264e86;
      border:none;
      padding:18px 24px;
      border-radius:18px;
      font-size:18px;
      cursor:pointer;
      box-shadow:0 4px 10px rgba(0,0,0,.15);
      transition:.3s;
    }

    .add-btn:hover{
      transform:scale(1.05);
    }

    .add-btn i{
      margin-right:8px;
    }

    /* NAVBAR */
    .navbar{
      position:absolute;
      bottom:0;
      width:100%;
      height:75px;
      background:#fff;
      display:flex;
      justify-content:space-around;
      align-items:center;
      border-top:1px solid #ddd;
    }

    .nav-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      color:#666;
      cursor:pointer;
      font-size:14px;
      transition:.3s;
    }

    .nav-item i{
      font-size:22px;
      margin-bottom:5px;
    }

    .nav-item.active{
      color:#111;
      font-weight:bold;
    }

    .nav-item.active i{
      background:#d8e7ff;
      padding:10px 18px;
      border-radius:20px;
    }

    /* RESPONSIVE */
    @media(max-width:420px){
      .phone{
        width:100%;
        height:100vh;
        border-radius:0;
        border:none;
      }
    }
  </style>
</head>
<body>

  <div class="phone">

    <!-- HEADER -->
    <div class="header">
      <h1>Telecom Manager</h1>
      <i class="fa-regular fa-bell bell"></i>
    </div>

    <!-- CONTENIDO -->
    <div class="dashboard">

      <!-- TARJETAS -->
      <div class="cards">

        <div class="card">
          <i class="fa-solid fa-clipboard blue"></i>
          <h2 id="total">0</h2>
          <p>Total</p>
        </div>

        <div class="card">
          <i class="fa-solid fa-circle-check green"></i>
          <h2 id="completed">0</h2>
          <p>Completados</p>
        </div>

        <div class="card">
          <i class="fa-solid fa-ellipsis orange"></i>
          <h2 id="pending">0</h2>
          <p>Pendientes</p>
        </div>

        <div class="card">
          <i class="fa-regular fa-hourglass-half purple"></i>
          <h2 id="progress">0</h2>
          <p>En Proceso</p>
        </div>

      </div>

      <!-- INGRESOS -->
      <div class="income">
        <div>
          <h3>Ingresos Totales</h3>
          <h1 id="income">$0.00</h1>
        </div>

        <i class="fa-solid fa-dollar-sign"></i>
      </div>

      <!-- SERVICIOS -->
      <div class="services">

        <div class="services-header">
          <h2>Servicios Recientes</h2>
          <span>Ver Todos</span>
        </div>

        <div class="empty" id="serviceContainer">
          <i class="fa-regular fa-clipboard"></i>
          <h3>No hay servicios recientes</h3>
          <p>Agrega tu primer servicio</p>
        </div>

      </div>

    </div>

    <!-- BOTON -->
    <button class="add-btn" onclick="addService()">
      <i class="fa-solid fa-plus"></i>
      Nuevo Servicio
    </button>

    <!-- NAVBAR -->
    <div class="navbar">

      <div class="nav-item active">
        <i class="fa-solid fa-house"></i>
        <span>Inicio</span>
      </div>

      <div class="nav-item">
        <i class="fa-solid fa-table-list"></i>
        <span>Servicios</span>
      </div>

      <div class="nav-item">
        <i class="fa-regular fa-file-lines"></i>
        <span>Reportes</span>
      </div>

      <div class="nav-item">
        <i class="fa-regular fa-user"></i>
        <span>Perfil</span>
      </div>

    </div>

  </div>

  <script>
    let total = 0;
    let completed = 0;
    let pending = 0;
    let progress = 0;
    let income = 0;

    function addService() {

      total++;
      pending++;
      income += 50;

      document.getElementById("total").textContent = total;
      document.getElementById("pending").textContent = pending;
      document.getElementById("income").textContent = "$" + income.toFixed(2);

      const container = document.getElementById("serviceContainer");

      container.innerHTML = `
        <div style="
          background:white;
          padding:15px;
          border-radius:15px;
          text-align:left;
          box-shadow:0 3px 10px rgba(0,0,0,.08);
        ">
          <h3 style="color:#222;">Instalación de Internet</h3>
          <p style="color:#777; margin-top:8px;">
            Servicio agregado correctamente
          </p>
        </div>
      `;
    }
  </script>

</body>
</html>
